name: xiji_flutter
description: 玺记 - 智能家庭记账应用，支持语音记账、家庭协作、统计分析
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.1
  
  # 路由导航
  go_router: ^13.0.0
  
  # HTTP 请求
  dio: ^5.4.0
  
  # 本地存储
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # 工具库
  intl: ^0.20.2
  fl_chart: ^0.65.0
  image_picker: ^1.0.7
  file_picker: ^8.1.2

  # 网络图片磁盘缓存（头像离线显示）
  cached_network_image: ^3.4.1

  # 生物识别日常解锁（6.6：指纹/面容解锁缓存密钥，口令仅开启/重置时输入）
  local_auth: ^2.3.0

  # 语音识别
  speech_to_text: ^7.3.0
  permission_handler: ^11.0.0
  
  # 二维码
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # 本地数据库（本地优先架构，数据真身）
  drift: '>=2.31.0 <2.32.0'
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.6

  # 账单 CSV 编码支持（支付宝账单为 GBK 编码）
  fast_gbk: ^1.0.0

  # 微信账单 XLSX 解析（官方邮箱导出为 XLSX 格式）
  excel: ^4.0.6

  # 端到端加密原语（AES-256-GCM、X25519；Argon2id 口令派生由 pointycastle 提供）
  cryptography: ^2.7.0
  pointycastle: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1
  drift_dev: '>=2.31.0 <2.32.0'
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true
  
  # 资源文件
  assets:
    - assets/images/
    - assets/category_rules.json

# 应用图标配置
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"

