name: xiji_flutter
description: 玺记 - 智能家庭记账应用，支持语音记账、家庭协作、统计分析
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.1
  
  # 路由导航
  go_router: ^13.0.0
  
  # HTTP 请求
  dio: ^5.4.0
  
  # 本地存储
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # 工具库
  intl: ^0.20.2
  fl_chart: ^0.65.0
  image_picker: ^1.0.7
  file_picker: ^8.1.2
  
  # 语音识别
  speech_to_text: ^7.3.0
  permission_handler: ^11.0.0
  
  # 二维码
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # 本地数据库（本地优先架构，数据真身）
  drift: '>=2.31.0 <2.32.0'
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.6

  # 账单 CSV 编码支持（支付宝账单为 GBK 编码）
  fast_gbk: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1
  drift_dev: '>=2.31.0 <2.32.0'
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true
  
  # 资源文件
  assets:
    - assets/images/
    - assets/category_rules.json

# 应用图标配置
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"

